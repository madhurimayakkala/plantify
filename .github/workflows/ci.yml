name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Placeholder values are enough for lint, unit tests and `next build`.
    #
    # The Playwright smoke test is different: the app waits for Clerk's
    # browser script to load before it renders anything, and that script is
    # fetched from your Clerk instance, so fake keys can't pass it. If you add
    # the two repo secrets below (use a Clerk *development* instance), the same
    # values are used for the build and the smoke test. Without them the smoke
    # test is skipped. NEXT_PUBLIC_* values are baked in at build time, which
    # is why they are set for the whole job.
    #
    #   CLERK_PUBLISHABLE_KEY_TEST  ->  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
    #   CLERK_SECRET_KEY_TEST       ->  CLERK_SECRET_KEY
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY_TEST || 'pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk' }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY_TEST || 'sk_test_placeholder' }}
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Check for Clerk test keys
        id: clerk
        run: echo "available=${{ secrets.CLERK_PUBLISHABLE_KEY_TEST != '' && secrets.CLERK_SECRET_KEY_TEST != '' }}" >> "$GITHUB_OUTPUT"

      - name: Skip notice for Playwright smoke test
        if: steps.clerk.outputs.available != 'true'
        run: echo "::notice::Playwright smoke test skipped. Add CLERK_PUBLISHABLE_KEY_TEST and CLERK_SECRET_KEY_TEST repo secrets (Clerk development instance) to enable it."

      - name: Install Playwright browser
        if: steps.clerk.outputs.available == 'true'
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke test
        if: steps.clerk.outputs.available == 'true'
        run: npx playwright test tests/smoke.spec.ts --project=chromium

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.clerk.outputs.available == 'true' }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
